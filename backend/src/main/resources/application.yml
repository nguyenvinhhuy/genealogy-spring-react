spring:
  application:
    name: genealogy
  datasource:
    # 5433, compose's published port: on this dev box 5432 is a Windows Postgres with another database.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/genealogy}
    username: ${DB_USER:postgres}
    # No fallback, like JWT_SECRET: a default here is a password published in the repo (§8.10 #14).
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # The schema is owned by Flyway (CLAUDE.md 4.1) - never let Hibernate write it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # A GEDCOM import inserts one row per statement without this: ~19,000 round trips for 3,000 people.
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Boot defaults to 1MB, which rejects an A3 scan of the gia pha long before MediaServiceImpl's
      # own 20MB check can run and explain the limit in Vietnamese.
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  tomcat:
    # Tomcat drops the connection after 2MB of an oversized upload, so the browser saw a reset, not the 413.
    max-swallow-size: 30MB
  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # No fallback on purpose: a default here is a signing key published in the repo.
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  storage:
    provider: ${STORAGE_PROVIDER:minio}
    bucket: ${MEDIA_BUCKET:genealogy-media}
    url-ttl: PT1H
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9100}
      # Where a browser reaches MinIO. Inside compose the backend talks to http://minio:9000, which
      # no browser can resolve, and a signed URL covers the host it was signed for.
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9100}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}

springdoc:
  # Off unless switched on, so forgetting to configure production leaves the contract private.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.genealogy: INFO
