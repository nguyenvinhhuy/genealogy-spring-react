<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gia phả</title>
    <!-- Before the first paint: a dark-mode or large-text reader otherwise sees one light, small frame (#31). -->
    <!-- The keys match shared/components/theme-provider and shared/lib/text-size. -->
    <script>
      try {
        var theme = localStorage.getItem('genealogy.theme')
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('text-large', localStorage.getItem('genealogy.text-size') === 'large')
      } catch (ignored) {
        // Blocked storage leaves the defaults; the app applies the same rule once it starts.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
